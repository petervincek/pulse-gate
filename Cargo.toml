[package]
name = "pulse-gate"
version = "0.1.0"
edition = "2024"

authors = ["Peter Vincek"]
description = "An enterprise-grade, dynamic API Gateway & metered billing proxy built in Rust with Axum, Redis, PostgreSQL, and Keycloak."

license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
chrono = {version = "0.4", features = ["serde"]}
directories = "6.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "macros"] }
thiserror = "2.0"
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter"] }
tracing-appender = "0.2"

redis = { version = "1.6", features = ["aio", "tokio-comp"] }
deadpool-redis = "0.23"

reqwest = { version = "0.13.4", features = ["stream"] }
hyper = "1.11.1"
dashmap = "6.2.1"
http-body-util = "0.1"

openidconnect = { version = "4.0.1", features = ["reqwest"] }

[dev-dependencies]
tempfile = "3"
testcontainers = "0.28.0"
